<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorveteria Doce Verão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main class="grade-principal">
      
      <!-- COLUNA ESQUERDA: Formulário -->
      <section class="cartao">
        <header>
          <div class="icone">🍦</div>
          <h1>Sorveteria <span>Doce Verão</span></h1>
          <p>Preencha os dados principais do pedido.</p>
        </header>

        <form id="pedido">
          <input type="hidden" id="edit-id">

          <label for="sabor">Sabor do sorvete</label>
          <select id="sabor" required>
            <option value="">Selecione o sabor</option>
            <option value="Chocolate" data-preco="15.00">Chocolate</option>
            <option value="Morango" data-preco="15.00">Morango</option>
            <option value="Baunilha" data-preco="12.00">Baunilha</option>
            <option value="Cookies" data-preco="17.00">Cookies</option>
          </select>

          <label for="preco">Preço do produto</label>
          <input id="preco" type="text" inputmode="numeric" placeholder="R$ 0,00" value="R$ 0,00" required>

          <label for="endereco">Endereço do cliente</label>
          <input id="endereco" type="text" placeholder="Ex.: Rua das Flores, 120 - Centro" required>

          <label for="pagamento">Forma de pagamento</label>
          <select id="pagamento" required>
            <option value="">Selecione o pagamento</option>
            <option value="Pix">Pix</option>
            <option value="Cartão">Cartão</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>

          <label for="situacao">Situação</label>
          <select id="situacao" required>
            <option value="Em preparo">Em preparo</option>
            <option value="Entregue">Entregue</option>
          </select>

          <button type="submit" id="btn-submit">🛒 Fazer pedido</button>
          <button type="button" id="btn-cancelar" class="btn-cancelar" style="display: none;">Cancelar edição</button>
          <p id="mensagem" role="status"></p>
        </form>
      </section>

      <!-- COLUNA DIREITA: Listagem e Pesquisa -->
      <section class="cartao">
        <div class="cabecalho-lista">
          <h2>Pedidos cadastrados</h2>
          <span id="contador-pedidos" class="subtitulo-lista">3 pedidos</span>
        </div>

        <label for="pesquisa">Pesquisar no catálogo</label>
        <input id="pesquisa" type="text" placeholder="Digite sabor, endereço ou pagamento...">
        <small class="dica-busca">A busca também considera a situação do pedido.</small>

        <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>PEDIDO</th>
                <th>PAGAMENTO</th>
                <th>SITUAÇÃO</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody id="lista-pedidos">
              <!-- Preenchido via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="rodape-exemplo">
      Exemplo de uma tabela simples: pedidos • identificador, sabor, endereço, pagamento e situação
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
